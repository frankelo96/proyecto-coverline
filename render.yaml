# Blueprint de Render para levantar una instancia de prueba del ERP.
# Render → New → Blueprint → elegir este repositorio y la rama. Crea el servicio
# web; la base PostgreSQL es externa (Neon) y se conecta con DATABASE_URL. Al arrancar
# aplica migraciones y carga la configuración inicial (el seed es idempotente).
services:
  - type: web
    name: coverline-erp
    runtime: node
    plan: free
    rootDir: erp
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run db:seed && npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Fechas de informes, vencimientos y "hoy" en hora argentina.
      - key: TZ
        value: America/Argentina/Buenos_Aires
      # Base PostgreSQL externa (Neon, plan gratuito sin vencimiento). La cadena de conexión
      # se pega en el panel de Render; nunca va al repositorio.
      - key: DATABASE_URL
        sync: false
      # Contraseña inicial de admin@coverline.local (Render la pide al crear el Blueprint).
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Facturación electrónica ARCA: se cargan en el panel de Render (homologacion / produccion).
      # La clave privada y el certificado nunca van al repositorio.
      - key: ARCA_MODE
        sync: false
      - key: ARCA_CUIT
        sync: false
      - key: ARCA_CERT
        sync: false
      - key: ARCA_KEY
        sync: false
      # Los presupuestos siguen la numeración actual de Contagram.
      - key: QUOTE_NEXT_NUMBER
        value: "377"
      # Tienda WooCommerce (solo stock). Las claves se cargan como secretas en Render.
      - key: WOO_URL
        value: https://www.uniformescoverline.com
      - key: WOO_CONSUMER_KEY
        sync: false
      - key: WOO_CONSUMER_SECRET
        sync: false
      - key: WOO_SYNC_MODE
        value: solo-lectura
      - key: WOO_SAFETY_STOCK
        value: "2"
